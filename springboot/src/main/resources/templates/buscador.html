<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador de avistamientos</title>
  <link rel="stylesheet" th:href="@{/css/buscador.css}">
  <script th:src="@{/js/buscador.js}" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="eyebrow">Sistema de avistamientos</p>
      <h1>Buscar avistamientos</h1>
      <p>Busca por nombre de ave, voluntario o comuna y evalúa cada registro.</p>
    </header>

    <section class="panel" aria-labelledby="search-title">
      <h2 id="search-title">Buscador</h2>
      <form id="search-form" role="search">
        <label for="search-input">Nombre de ave, voluntario o comuna</label>
        <input id="search-input" name="q" type="text" autocomplete="off"
               placeholder="Comienza a escribir para buscar" aria-describedby="search-status">
      </form>
      <p id="search-status" class="status" role="status" aria-live="polite">Escribe para buscar avistamientos.</p>

      <div id="results-wrap" class="table-wrap" hidden>
        <table>
          <thead>
            <tr>
              <th scope="col">Voluntario</th>
              <th scope="col">Día</th>
              <th scope="col">Ave</th>
              <th scope="col">Comuna</th>
              <th scope="col">Nota promedio</th>
              <th scope="col">Evaluar</th>
            </tr>
          </thead>
          <tbody id="results"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
