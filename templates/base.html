<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Sistema de avistamientos{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <nav class="main-nav" aria-label="Menú principal">
          <a href="{{ url_for('index') }}">Inicio</a>
          <a href="{{ url_for('registrar_voluntario') }}">Registrar voluntario</a>
          <a href="{{ url_for('informar_avistamiento') }}">Informar Avistamiento</a>
          <a href="{{ url_for('listar_avistamientos') }}">Listado</a>
          <a href="{{ url_for('estadisticas') }}">Estadísticas</a>
        </nav>
      </div>
    </header>

    <main class="container page-content">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
